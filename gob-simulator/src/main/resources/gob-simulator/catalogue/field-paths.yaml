# Baseline entity defaults — belong to no result-code row (CIMD-4372 has no table entry for
# them), and each is flagged `baseline: true` (Task 8, ruling 1). defaultFor() unions every
# non-unmapped field-paths.yaml entry whose root property matches a requested-but-otherwise-
# untouched entity, so an entity with a schema `required` block never comes back as an empty
# object failing that block. NowsDataItemsAssembler ALSO merges baseline-flagged rows only (never
# the full defaultFor union) into an entity a posted code left only PARTIALLY populated, filling
# just the fields that code's own contribution is missing — existing values always win, and
# non-required fields are deliberately never merge-filled this way, so a code's own contribution
# stays observable. Verified against v0.4.0 directly (not copied from anywhere): Defendant
# requires only defName; Offence requires dateImposed/offenceCode/offenceTitle/impositions/
# offenceTotal; Imposition requires amountImposed/amountPaid/impositionBalance (amountImposed
# already covered by "Amount Imposed" above); CtBankDetails requires both ct_account_number and
# ct_sort_code. PaymentHistory and TransactionHistory declare no required properties at all (the
# `payment`/`transaction` arrays are not themselves required), so `{}` already validates and
# neither needs an entry here.
"Defendant Name":
  { path: defendant.defName, type: string, default: "Simulated Defendant", baseline: true }
"Offence Date Imposed":
  { path: "offences.offence[0].dateImposed", type: string, default: "15 Jan 2026", baseline: true }
"Offence Code":
  { path: "offences.offence[0].offenceCode", type: string, default: "SIM0001", baseline: true }
"Offence Title":
  { path: "offences.offence[0].offenceTitle", type: string, default: "Simulated Offence", baseline: true }
"Offence Total":
  { path: "offences.offence[0].offenceTotal", type: number, default: 1250.00, baseline: true }
"Imposition Amount Paid":
  {
    path: "offences.offence[0].impositions.imposition[0].amountPaid",
    type: number, default: 375.00, baseline: true
  }
"Imposition Balance":
  {
    path: "offences.offence[0].impositions.imposition[0].impositionBalance",
    type: number, default: 875.50, baseline: true
  }
"CT Account Number":
  { path: ctBankDetails.ct_account_number, type: integer, default: 12345678, baseline: true }
"CT Sort Code":
  { path: ctBankDetails.ct_sort_code, type: integer, default: 112233, baseline: true }
