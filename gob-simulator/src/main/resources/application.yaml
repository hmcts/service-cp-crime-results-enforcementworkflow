spring:
  application:
    name: gob-simulator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:gob-simulator}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Every schema in the bundled contract is additionalProperties: false. Spring Boot 4's
      # Jackson 3 defaults FAIL_ON_UNKNOWN_PROPERTIES to false (unlike Jackson 2), and the
      # per-record @JsonIgnoreProperties(ignoreUnknown = false) annotation is not honoured for
      # Java records by tools.jackson.databind 3.1.5's record deserialiser — confirmed empirically
      # (see task-7-report.md). Setting the feature globally is the fix that actually holds.
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8091}

gob:
  simulator:
    seed-dir: ${GOB_SIMULATOR_SEED_DIR:}

logging:
  level:
    root: INFO
