name: CI Build and Publish

on:
  workflow_call:
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME:
        required: true
      AZURE_DEVOPS_ARTIFACT_TOKEN:
        required: true
      HMCTS_ADO_PAT:
        required: true
    inputs:
      is_release:
        required: false
        type: boolean
        default: false
      is_publish:
        required: true
        type: boolean
      trigger_docker:
        required: true
        type: boolean
      trigger_deploy:
        required: true
        type: boolean


jobs:
  Artefact-Version:
    runs-on: ubuntu-latest
    outputs:
      artefact_version: ${{ steps.version.outputs.artefact_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Artefact Version
        id: artefact
        uses: hmcts/artefact-version-action@v1
        with:
          release: ${{ inputs.is_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch-aware version resolution. Release builds keep the action's tag-derived
      # release_version. Non-release builds avoid leaking the latest semver tag's label
      # into every branch's image:
      #   team/** push -> <branch-name-without-team/>-<short-sha>
      #   main / other -> <projectVersion from gradle.properties>-<short-sha>
      - name: Resolve artefact version
        id: version
        env:
          IS_RELEASE: ${{ inputs.is_release }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.artefact.outputs.release_version }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="$RELEASE_VERSION"
          elif [[ "$REF_NAME" == team/* ]]; then
            BRANCH="${REF_NAME#team/}"
            BRANCH="${BRANCH//\//-}"
            VERSION="${BRANCH}-${SHORT_SHA}"
          else
            PROJECT_VERSION="$(grep -E '^projectVersion=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            VERSION="${PROJECT_VERSION}-${SHORT_SHA}"
          fi
          echo "Resolved artefact version: $VERSION"
          echo "artefact_version=$VERSION" >> "$GITHUB_OUTPUT"

  Build:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.repo_vars.outputs.repo_name }}
      artefact_name: ${{ steps.repo_vars.outputs.artefact_name }}
      simulator_artefact_name: ${{ steps.repo_vars.outputs.simulator_artefact_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Integration tests need a real Postgres on localhost:5432 (PostgresInitialise), as in
      # service-cp-crime-results-pcr, which starts its compose services before the build.
      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Gradle Build
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          echo "Building with ARTEFACT_VERSION=$ARTEFACT_VERSION"
          ./gradlew build -DARTEFACT_VERSION=$ARTEFACT_VERSION

      - name: Extract repo name
        id: repo_vars
        run: |
          repo_name=${GITHUB_REPOSITORY##*/}
          echo "repo_name=${repo_name}" >> $GITHUB_OUTPUT
          echo "artefact_name=${repo_name}-${{ needs.Artefact-Version.outputs.artefact_version }}" >> $GITHUB_OUTPUT
          # The simulator subproject's boot jar is named after the Gradle project, not the repo
          # (gradle/jar.gradle uses ${project.name}), so it needs its own name.
          echo "simulator_artefact_name=enforcement-workflow-simulator-${{ needs.Artefact-Version.outputs.artefact_version }}" >> $GITHUB_OUTPUT

      - name: Upload JAR Artefact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/${{ steps.repo_vars.outputs.artefact_name }}.jar

      # ./gradlew build already produces this alongside the service jar; it just was not being
      # carried to a later job. Uploaded separately so Build-Docker-Simulator can consume it
      # without rebuilding.
      - name: Upload Simulator JAR Artefact
        uses: actions/upload-artifact@v7
        with:
          name: simulator-jar
          path: enforcement-workflow-simulator/build/libs/${{ steps.repo_vars.outputs.simulator_artefact_name }}.jar

  Provider-Deploy:
    needs: [ Artefact-Version, Build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Gradle Publish
        if: ${{ inputs.is_publish }}
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
        run: |
          if [ -z "AZURE_DEVOPS_ARTIFACT_USERNAME" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_USERNAME is null or not set"
          fi

          if [ -z "$AZURE_DEVOPS_ARTIFACT_TOKEN" ]; then
            echo "::warning::AZURE_DEVOPS_ARTIFACT_TOKEN is null or not set"
          fi

          echo "Publishing artefact for version: $ARTEFACT_VERSION"
          
          ./gradlew publish \
            -DARTEFACT_VERSION=$ARTEFACT_VERSION \
            -DGITHUB_REPOSITORY=${{ github.repository }} \
            -DGITHUB_ACTOR=${{ github.actor }} \
            -DGITHUB_TOKEN=$GITHUB_TOKEN \
            -DAZURE_DEVOPS_ARTIFACT_USERNAME=$AZURE_DEVOPS_ARTIFACT_USERNAME \
            -DAZURE_DEVOPS_ARTIFACT_TOKEN=$AZURE_DEVOPS_ARTIFACT_TOKEN

  Build-Docker:
    needs: [ Provider-Deploy, Build, Artefact-Version ]
    if: ${{ inputs.trigger_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download JAR Artefact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GitHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          build-args: |
            BASE_IMAGE=eclipse-temurin:25
            JAR_FILENAME=${{ needs.Build.outputs.artefact_name }}.jar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.Artefact-Version.outputs.artefact_version }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  # Second deployable from this repo: the non-live enforcement-workflow simulator. Mirrors
  # Build-Docker, but pushes to a nested package under the same repository so the two images
  # never collide, and shares Artefact-Version so both carry the identical tag.
  #
  # Deliberately does NOT need Provider-Deploy: that job publishes the service jar to Azure
  # Artifacts / GitHub Packages, and the simulator is excluded from publishing by design
  # (ADR-001). Waiting on it would only couple this image to an unrelated step.
  Build-Docker-Simulator:
    needs: [ Build, Artefact-Version ]
    if: ${{ inputs.trigger_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Simulator JAR Artefact
        uses: actions/download-artifact@v8
        with:
          name: simulator-jar
          path: enforcement-workflow-simulator/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context is the repo root because enforcement-workflow-simulator/Dockerfile copies the jar
      # from enforcement-workflow-simulator/build/libs/.
      - name: Build and Push Simulator Image to GitHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: enforcement-workflow-simulator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/enforcement-workflow-simulator:${{ needs.Artefact-Version.outputs.artefact_version }}
          build-args: |
            BASE_IMAGE=eclipse-temurin:25-jre
            JAR_FILE=enforcement-workflow-simulator/build/libs/${{ needs.Build.outputs.simulator_artefact_name }}.jar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/enforcement-workflow-simulator:${{ needs.Artefact-Version.outputs.artefact_version }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

  Deploy:
    # Also waits on both docker jobs (not just Provider-Deploy) so the ACR-copy triggers below
    # never race ahead of the GHCR pushes they read from. skipped is accepted because
    # trigger_docker can be false independently of trigger_deploy.
    needs: [ Provider-Deploy, Build, Artefact-Version, Build-Docker, Build-Docker-Simulator ]
    if: >-
      ${{ inputs.trigger_deploy &&
          (needs.Build-Docker.result == 'success' || needs.Build-Docker.result == 'skipped') &&
          (needs.Build-Docker-Simulator.result == 'success' || needs.Build-Docker-Simulator.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Extract repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Trigger ADO pipeline for service image
        uses: hmcts/trigger-ado-pipeline@v2
        with:
          pipeline_id: 460
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          template_parameters: >
            {
              "GROUP_ID": "uk.gov.hmcts.cp",
              "ARTIFACT_ID": "${{ env.REPO_NAME }}",
              "ARTIFACT_VERSION": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "TARGET_REPOSITORY": "${{ github.repository }}",
              "gitRef": "${{ github.event.pull_request.head.sha || github.sha }}",
              "agentDemand": "ubuntu-j25",
              "baseImage": "hmcts/apm-services:25-jre"
            }

      # ---- Simulator image: copy the GHCR image to the non-live ACR (no rebuild) -------------------
      # Non-live ACR only: the simulator must never run in a live environment (LiveEnvironmentGuard).
      - name: Pull simulator image from GHCR for the ACR relay
        if: needs.Build-Docker-Simulator.result == 'success'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/enforcement-workflow-simulator:${{ needs.Artefact-Version.outputs.artefact_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CRANE_ARCHIVE="${RUNNER_TEMP}/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --show-error --location --output "${CRANE_ARCHIVE}" \
            "https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz"
          echo "1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230  ${CRANE_ARCHIVE}" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "${CRANE_ARCHIVE}" crane
          # --password-stdin keeps the token out of argv.
          printf '%s' "${GH_TOKEN}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p relay
          echo "Pulling ${IMAGE}"
          crane pull "${IMAGE}" relay/simulator.tar
          # Fingerprint the image CONFIG, not the manifest: crane's tarball round-trip re-serialises
          # the manifest, but the config blob (which pins every layer and setting) is byte-preserved.
          printf 'simulator %s\n' "$(crane config "${IMAGE}" | sha256sum | awk '{print $1}')" > relay/digests.txt
          cat relay/digests.txt

      - name: Upload simulator image for the ACR relay
        if: needs.Build-Docker-Simulator.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          # Pipeline 794 looks the artifact up by this exact name.
          name: relay-images
          path: relay/
          retention-days: 1

      - name: Trigger ADO pipeline to publish the simulator image to ACR
        id: simulator_relay
        if: needs.Build-Docker-Simulator.result == 'success'
        uses: hmcts/trigger-ado-pipeline@v2
        with:
          pipeline_id: 794
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          template_parameters: >
            {
              "version": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "target": "nonlive",
              "gh_run_id": "${{ github.run_id }}",
              "ghOwner": "${{ github.repository_owner }}",
              "ghRepo": "${{ env.REPO_NAME }}",
              "acrRepoPrefix": "hmcts/${{ env.REPO_NAME }}/enforcement-workflow",
              "services": ["simulator"]
            }

      # trigger-ado-pipeline is fire-and-forget: without this wait a failed ACR publish would still
      # leave this workflow green. 90 min covers time spent queued for an ADO agent.
      - name: Wait for the simulator ACR publish to complete
        if: needs.Build-Docker-Simulator.result == 'success'
        uses: hmcts/monitor-ado-pipeline@e3b81954f702a5b08cc7104d773de7610eb6f67f
        with:
          pipeline_id: 794
          run_id: ${{ steps.simulator_relay.outputs.run_id }}
          ado_pat: ${{ secrets.HMCTS_ADO_PAT }}
          timeout: '5400'
