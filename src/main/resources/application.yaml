spring:
  application:
    name: service-cp-crime-results-enforcementworkflow
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}
  jms:
    pub-sub-domain: true                 # public.event is a multicast topic (also for publishing the GOB data event)
    subscription-durable: true           # durable: events queued while down are still delivered
    client-id: service-cp-crime-results-enforcementworkflow
    listener:
      auto-startup: ${ARTEMIS_LISTENER_ENABLED:true}   # enabled by default (listener only loads under the 'docker' profile)
  # Postgres + Flyway, service-cp-crime-results-pcr pattern (constitution Principle III)
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/enforcementworkflowdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    hikari:
      # a running task holds its own connection plus one per REQUIRES_NEW write (research OP-15): >= 2 x job threads + API
      maximum-pool-size: ${DATASOURCE_MAX_POOL:12}
      # fail fast (503 to the Function App, retry for a task) rather than wait 30 s for a connection
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT_MS:5000}
      data-source-properties:
        # As service-cp-crime-informant-register: a database that dies without closing its connections would otherwise
        # leave a query waiting for ever, holding a job thread and its claimed task. Seconds, per the PostgreSQL driver.
        socketTimeout: 30
        # FR-017: Postgres error details quote the failing row ("Failing row contains (...)", request_payload
        # included), and Hibernate logs the driver message. Keep the detail out of messages and logs.
        logServerErrorDetail: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8083}

# CP public topic: connectivity logging (active only under the 'docker' profile) and the GOB data event (feature 003).
# The logging selector filters to results public events only (e.g. public.results.police-result-generated).
cp:
  messaging:
    # AKS: public.event; the local cpp-developers-docker broker: jms.topic.public.event (auto-create off)
    public-event-topic: ${CP_MESSAGING_PUBLIC_EVENT_TOPIC:public.event}
    subscription-name: service-cp-crime-results-enforcementworkflow.public.event.logger
    # Feature 005 (research.md R2, plan.md D8): broadened to also receive the doc generator's own completion events
    # on this SAME single durable subscription - spring.jms.client-id is one service-wide id, so a second
    # @JmsListener container attempting its own connection with that same id fails (InvalidClientIDException,
    # confirmed empirically); PublicEventLoggingListener delegates systemdocgenerator events to
    # DocGeneratorEventListener rather than this being a second subscription.
    selector: "CPPNAME LIKE 'public.results%' OR CPPNAME IN ('public.systemdocgenerator.events.document-available', 'public.systemdocgenerator.events.generation-failed')"
    # feature 003 research R12: consumed by cpp-context-hearing-nows; must not start with public.results
    gob-data-event-name: public.enforcementworkflow.enforcement-nows-data-ready
    # The event carries no _metadata.context.user: hearing-nows then acts as its own context system user (CppEnvelope)
  # Notifications from the results-processing Function App (feature 003, research R2, R10)
  notification:
    # CJSCPPUIDs allowed to notify; empty closes the endpoint
    allowed-system-users: ${NOTIFICATION_ALLOWED_SYSTEM_USERS:}
    retry-durations: ${NOTIFICATION_RETRY_DURATIONS:10s,60s,300s}
    replay-schedule: ${NOTIFICATION_REPLAY_SCHEDULE:15m,1h,4h,12h,24h}
  # Share results for stage 1 (feature 003, contracts/results-data-sources.md)
  results:
    base-url: ${RESULTS_URL:http://localhost:8080}
    # A System Users member. Required, no default (StartupPropertiesValidator)
    cjscppuid: ${RESULTS_CJSCPPUID:}
    connect-timeout: 5s
    read-timeout: 10s
  # Results cache (feature 003, research R8): the Results context's Azure Managed Redis, read with Entra ID (managed
  # identity), no access key. Same layout as service-cp-crime-informant-register: LOCAL development defaults here, and
  # deployed environments set them through environment variables bound by name (no placeholders):
  #   CP_RESULTSCACHE_ENABLED, CP_RESULTSCACHE_HOST, CP_RESULTSCACHE_PORT (10000 deployed), CP_RESULTSCACHE_SSL (true
  #   deployed), CP_RESULTSCACHE_USERNAME (the managed identity's object id).
  # When disabled, no Redis client exists and stage 1 reads the Results query only.
  results-cache:
    enabled: false
    host: localhost
    port: 6379
    ssl: false
    connect-timeout: 2s
    command-timeout: 2s
    username: ""
    managed-identity-client-id: ${AZURE_CLIENT_ID:}
  # Enforcement case predicate: same logic as the enforcement gateway (research.md R1)
  enforcement:
    authority-code: ${ENFORCEMENT_AUTHORITY_CODE:GAPGD00}
  # Timeout budget (research.md R20): each hop gives up before its caller
  reference-data:
    base-url: ${REFERENCEDATA_URL:http://localhost:8081}
    # A System Users member. Required, no default (StartupPropertiesValidator)
    cjscppuid: ${REFERENCEDATA_CJSCPPUID:}
    connect-timeout: 5s
    read-timeout: 10s
  enforcement-gateway:
    base-url: ${ENFORCEMENT_GATEWAY_URL:http://localhost:8082}
    connect-timeout: 5s
    read-timeout: 50s   # must exceed the gateway's own total towards APIM (5s + 40s)
  # Feature 005: enforcement_area reference-data lookup (contracts/enforcement-area.md - OPEN DEPENDENCY, CIMD-4389,
  # plan.md D1). Shape is this feature's own assumption pending confirmation.
  enforcement-area:
    base-url: ${ENFORCEMENT_AREA_URL:http://localhost:8081}
    cjscppuid: ${ENFORCEMENT_AREA_CJSCPPUID:}
    connect-timeout: 5s
    read-timeout: 10s
  # Feature 005: System Doc Generator BYO-FS generate-document command (contracts/system-doc-generator-byo-fs.md;
  # branch team/CHD-2786, unmerged at time of writing - go-live gate, plan.md D4).
  doc-generator:
    base-url: ${DOC_GENERATOR_URL:http://localhost:8089}
    connect-timeout: 5s
    read-timeout: 10s
  hearing-result:
    result-code-renames:
      TFOUT: TFOOUT
      WC: DW
      WWDN: WDN
    # research.md R7: CP shortCode -> GOB NowsDataItemName values. CIMD-4634: the rows of the "Result vs Required Field"
    # table, column "Response entity(s) in nowsDataItems", of CIMD-4372 (BA, as written; camelCase entity -> enum name).
    # Keyed by the CP shortCode before result-code-renames: the table's DW row is CP's WC, its TFOUT / TFOOUT row both.
    # Codes not listed (e.g. NOENF, WDN, BPOCRFSD) request nothing, so nowsDataRequest is left out.
    # 2026-11-20 (BA): the table's "Defendant Account" means the GOB account number, so it is requested as
    # "Account Number" (GOB's contract: "Defendant Account" is the `defendant` debtor details entity, "Account Number"
    # is `accountNumber`); the warrant rows request it too. ABDC corrected to the account number and balance only
    # (accountBalance is both Total Balance and Balance Outstanding). LATG / LATR are descoped (no rows).
    # Still open with the BA: the codes not in the table.
    nows-data-items-by-short-code:
      ABDC: [Account Number, Account Balance]
      ACF: [Account Number, Account Offences and Penalties, Account Terms to Pay]
      AEC: [Account Number, Account Balance]
      AEO: [Account Number, Account Balance, Account Terms to Pay, CT Account Bank Details]
      AEOC: [Account Number, Account Balance, Account Terms to Pay]
      BWTD: [Account Number, Account Warrant Number, Warrant Contact Details, Days Before Release of Warrant,
             Account Balance, Account Bail Amount]
      BWTU: [Account Number, Account Warrant Number, Warrant Contact Details, Days Before Release of Warrant,
             Account Balance, Account Bail Amount, Account Offences and Penalties, Account Date Imposed,
             Account Terms to Pay]
      CLAMPO: [Account Number, Account Warrant Number, Warrant Contact Details, Account Balance, Account Terms to Pay]
      CLAMPS: [Account Number, Account Warrant Number, Warrant Contact Details, Account Balance]
      COLLO: [Account Number, Account Balance, Account Offences and Penalties, Account Terms to Pay]
      CW: [Account Number, Account Warrant Number, Warrant Contact Details, Days Before Release of Warrant,
           Account Balance, Account Bail Amount, Account Offences and Penalties, Account Date Imposed,
           Account Terms to Pay]
      CWN: [Account Number, Account Balance, Account Bail Amount]
      FIDIC: [Account Number, Account Offences and Penalties]
      FIDICT: [Account Number, Account Offences and Penalties]
      FSN: [Account Number, Account Balance]
      FTTP: [Account Number, Account Balance]
      MPSO: [Account Number, Account Balance, Account Terms to Pay, Account History]
      NBWT: [Account Number, Account Warrant Number, Warrant Contact Details, Days Before Release of Warrant,
             Account Balance, Account Bail Amount, Account Offences and Penalties, Account Date Imposed,
             Account Terms to Pay]
      PGPAY: [Account Number, Account Balance, Account Offences and Penalties, Account Date Imposed,
              Account Terms to Pay]
      PTNV: [Account Number, Account Balance, Account Offences and Penalties, Account Date Imposed,
             Account Terms to Pay]
      REGF: [Account Number, Account Balance, Account Date Imposed]
      REM: [Account Number, Account Balance]
      S136: [Account Number, Account Warrant Number, Warrant Contact Details, Account Balance, Account Bail Amount,
             Account Offences and Penalties, Account Date Imposed]
      SC: [Account Number, Account Balance, Account Offences and Penalties, Account Date Imposed, Account Terms to Pay]
      SUMM: [Account Number, Account Balance, Account Offences and Penalties, Account Date Imposed]
      TFOUT: [Account Balance]
      TFOOUT: [Account Balance]
      WC: [Account Number, Account Warrant Number, Warrant Contact Details, Account Balance,
           Account Offences and Penalties, Account Date Imposed]
      DW: [Account Number, Account Warrant Number, Warrant Contact Details, Account Balance,
           Account Offences and Penalties, Account Date Imposed]
    # feature 002 research R19 (OQ-13): shortCodes marking an adjournment; an offence adjourned in a share is not sent
    adjournment-result-codes: ${ADJOURNMENT_RESULT_CODES:NEXH,ADJNN}
    # research.md R19: stale SENDING -> FAILED (INTERRUPTED), never resent
    stale-sending-threshold: ${STALE_SENDING_THRESHOLD:PT5M}
    stale-sending-sweep-interval: ${STALE_SENDING_SWEEP_INTERVAL:PT1M}
    payment-terms:
      # CIMD-4251 OQ-1 (resolved 2026-11-18). CP reference data, the same in every environment: not per environment.
      # Prompt references: the INSTL, LUMSI, PDATE and PTFOR result definitions primed into CP environments
      # (cpp-platform-priming criminalCourtsResultDefinitions). PARENT_GAURDIAN_TO_PAY is CP's own spelling. ISTD is
      # the instalment start date reference of older definitions (cpp-context-hearing test reference data).
      prompts:
        instalment-amount: [IAMT]
        frequency: [PF]
        lump-sum: [LSA]
        instalment-start-date: [instalmentStartDate, ISTD]
        pay-by-date: [PBD]
        payment-card-required: [PAYMENT_CARD_REQUIRED]
        parent-guardian-to-pay: [PARENT_GAURDIAN_TO_PAY]
      # PF fixed list e555e078-5dd8-11e8-9c2d-fa7ae01bbebc (values compared ignoring case)
      frequency-values:
        W: [weekly]
        F: [fortnightly]
        M: [monthly]
      # BOOLEAN prompts: hearing publishes Yes/No (TypeUtils.convertBooleanPromptValue) or true/false (older path)
      yes-values: ["Yes", "true"]
      no-values: ["No", "false"]
      # DATE prompts: hearing publishes dd/MM/yyyy (PublishResultUtil, converted from yyyy-MM-dd); dd MMM yyyy is the
      # third date form hearing itself accepts (restructure Constants.DATE_FORMATS_WITHOUT_TIME). CURR prompts carry a
      # leading £, which the parser accepts.
      date-formats: [dd/MM/yyyy, yyyy-MM-dd, dd MMM yyyy]
  # Feature 005 (CIMD-4548, CIMD-4543): the Trigger ShortCode List (FR-001/FR-011), Confiscation Division Codes
  # (FR-003), Docmosis template ids, and this feature's own retry schedule - independent of cp.notification.*.
  result-notification:
    trigger-short-codes:
      ENFORCEMENT: ${RESULT_NOTIFICATION_ENFORCEMENT_SHORT_CODES:ACF,AEC,AEO,AEOC,CLAMPO,CW,CWN,FIDIC,FIDICT,FIDIP,FTTP,MPSO,REGF,S136,TFOOUT,WDN}
      CONFISCATION: ${RESULT_NOTIFICATION_CONFISCATION_SHORT_CODES:BPOC}
    confiscation-division-codes: ${RESULT_NOTIFICATION_CONFISCATION_DIVISION_CODES:45,66,97,109,110,116}
    docmosis-template-ids:
      FIRST_SHARE: ${RESULT_NOTIFICATION_FIRST_SHARE_TEMPLATE_ID:enforcement-result-notification-first-share}
      AMEND_RESHARE: ${RESULT_NOTIFICATION_AMEND_RESHARE_TEMPLATE_ID:enforcement-result-notification-amend-reshare}
    retry-durations: ${RESULT_NOTIFICATION_RETRY_DURATIONS:10s,60s,300s}
  # Feature 005: this service's one Blob container (research.md R8) - DefaultAzureCredential/Workload Identity in
  # every real environment; azurite-enabled is local dev/IT only (Azurite has no Azure AD support).
  result-notification-blob:
    endpoint: ${CP_RESULT_NOTIFICATION_BLOB_ENDPOINT:https://localhost.blob.core.windows.net}
    container-name: ${CP_RESULT_NOTIFICATION_BLOB_CONTAINER_NAME:result-notification}
    azurite-enabled: ${CP_RESULT_NOTIFICATION_BLOB_AZURITE_ENABLED:false}
    connection-string: ${CP_RESULT_NOTIFICATION_BLOB_CONNECTION_STRING:}
    connection-timeout-seconds: 10s
    response-timeout-seconds: 30s
    transfer-timeout-seconds: 300s
  # Feature 005: cp-gov-uk-notify-gateway dispatch over Azure Service Bus (research.md R1, R5) - Workload Identity
  # only; no connection strings in any real environment.
  gov-uk-notify:
    namespace: ${CP_GOV_UK_NOTIFY_NAMESPACE:localhost}
    send-email-queue: ng-send-email
    reply-to-queue: enforcementworkflow-notification-result
    template-ids:
      FIRST_SHARE: ${CP_GOV_UK_NOTIFY_FIRST_SHARE_TEMPLATE_ID:00000000-0000-0000-0000-000000000001}
      AMEND_RESHARE: ${CP_GOV_UK_NOTIFY_AMEND_RESHARE_TEMPLATE_ID:00000000-0000-0000-0000-000000000002}

# cp-task-manager (feature 003, research R10): its tables come from this service's migrations (V1.006, V1.007)
taskmanager:
  schema:
    enabled: false
job:
  executor:
    poll-interval: ${JOB_EXECUTOR_POLL_INTERVAL:5000}
    core-pool-size: 2
    max-pool-size: 4
    # claim only what can run soon: claimed jobs of a pod that dies are not reclaimed (research OP-14)
    batch-size: 4
    queue-capacity: 4

azure:
  application-insights:
    instrumentation-key: ${rpe.AppInsightsInstrumentationKey:00000000-0000-0000-0000-000000000000}

management:
  otlp:
    metrics:
      export:
        # No OTLP collector runs in our environments: the default push to localhost:4318 only logged
        # "Failed to publish metrics to OTLP receiver" every minute. Metrics are scraped from
        # /actuator/prometheus. Same setting as service-cp-crime-results-pcr; set the variable to push.
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
  health:
    jms:
      # The Artemis starter auto-registers a JMS health indicator that opens a broker connection
      # on every /actuator/health call. Disabled: connectivity is proven via the listener log, and
      # we don't want the aggregate health (or a broker outage) to flap the service. Probe groups
      # (liveness/readiness) don't include it anyway.
      enabled: false

logging:
  level:
    root: INFO
