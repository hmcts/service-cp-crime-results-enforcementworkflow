plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.64.0'
  id 'org.cyclonedx.bom' version '3.4.1'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/publishing.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
  from("$rootDir/gradle/apispec-validation.gradle")
}

// Contract jars whose versions validateApiSpecVersions checks on release (constitution Principle II).
configurations {
  apiSpec
}

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Api spec: enforcement gateway contract (generated HearingResultedRequest/Response models).
  // 0.2.0 adds POST /enforcement-notifications (tag enforcement-notification, implemented by this service, CIMD-4530).
  // LOCAL draft (publishToMavenLocal -DAPI_SPEC_VERSION=0.2.0-local) until the contract PR publishes a draft; replace
  // with a fixed X.Y.Z release before a release build: validateApiSpecVersions rejects draft versions (task T078).
  implementation('uk.gov.hmcts.cp:api-cp-crime-results-enforcementgateway:0.2.0-local')
  apiSpec('uk.gov.hmcts.cp:api-cp-crime-results-enforcementgateway:0.2.0-local')
  // Generated models carry @Schema annotations; needed on the compile classpath (-Werror), as in service-cp-crime-results-pcr
  implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'

  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }


  // --- Observability / Actuator / OTEL / Prometheus ---
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

  // Security: pin transitive tomcat-embed-core to patched version (CVE-2026-41293, -43512, et al.)
  // Brought in transitively via spring-boot-starter-web; >=11.0.0-M1,<11.0.22 are vulnerable
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26'

  // Spring boot database / postgres (service-cp-crime-results-pcr pattern, constitution Principle III)
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.postgresql:postgresql'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'

  // Test: HTTP stubs and contract-schema validation of outbound payloads (Principle VII)
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
  testImplementation 'com.networknt:json-schema-validator:1.5.9'
  testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
  // Embedded Artemis broker: JMS end-to-end integration tests with the real listeners (research.md R25)
  testImplementation 'org.apache.artemis:artemis-jakarta-server'

  // --- Messaging: CP 'public.event' Artemis topic (diagnostic subscription; GOB data event publishing, CIMD-4530) ---
  implementation 'org.springframework.boot:spring-boot-starter-artemis'

  // --- Queued work, retries and replays (cp-task-manager; constitution 1.2.0, feature 003 research R10) ---
  implementation 'uk.gov.hmcts.cp:task-manager-service:1.0.11'

  // --- Results cache (Azure Cache for Redis), Entra ID auth with managed identity; no access keys (research R8) ---
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'com.azure:azure-identity:1.18.1'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

// Guard against legacy javax.jms on the classpath alongside Spring Boot 4's jakarta.jms.
configurations.all {
  exclude group: 'javax.jms', module: 'javax.jms-api'
  exclude group: 'org.apache.activemq', module: 'artemis-jms-client'
}
