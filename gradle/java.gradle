java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked" << "-Werror"
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

// The 'wrapper' task only exists on the root project, but this file is now also applied
// to subprojects (e.g. :enforcement-workflow-simulator) — match by name instead of tasks.named() so it's a
// no-op there instead of failing configuration.
tasks.matching { it.name == 'wrapper' }.configureEach {
  delete "${projectDir}/gradlew.bat"
}

springBoot {
  buildInfo {
    properties {
      name = project.name
      version = project.version.toString()
    }
  }
}

apply plugin: 'idea'
idea {
  module {
    excludeDirs += file('.claude')
  }
}