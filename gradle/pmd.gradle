apply plugin: 'pmd'

pmd {
  ruleSets = []
  ruleSetFiles = rootProject.files(".github/pmd-ruleset.xml")
  ignoreFailures = false
}

tasks.named("pmdMain").configure {
  // Opt-in task: only runs when explicitly requested, whether invoked as the bare
  // task name ("pmdMain") or qualified with a subproject path (":gob-simulator:pmdMain").
  onlyIf {
    gradle.startParameter.taskNames.any { requested ->
      requested == name || requested == path || requested.endsWith(":${name}")
    }
  }
}

tasks.named("pmdTest").configure {
  enabled = false
}

tasks.withType(Pmd) {
  reports {
    xml.required.set(true)
    html.required.set(true)
  }
}

tasks.withType(Checkstyle).configureEach {
  def generatedDir = file("${layout.buildDirectory.get().asFile.absolutePath}/generated/src/main/java").canonicalPath
  source = source.filter { file ->
    !file.canonicalPath.startsWith(generatedDir)
  }
}
