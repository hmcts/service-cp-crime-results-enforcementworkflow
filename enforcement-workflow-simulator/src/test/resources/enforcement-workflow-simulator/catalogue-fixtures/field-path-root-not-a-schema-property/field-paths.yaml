# `baseline: true` means "this path is schema-required", full stop — not "this entry was added
# for Task 8" and not "no result code posts this". These next three are schema-required (Offices
# requires accountTotal/accountPaid; Imposition requires amountImposed) but ALSO carry a normal
# CIMD-4372 field label used by some result codes' own field lists — a label being posted by some
# codes and being schema-required are independent facts, and both of the three below happen to be
# true. NowsDataItemsAssembler.mergeBaselineGaps() reads this flag to fill a schema-required gap
# left by a posted code's PARTIAL contribution to an entity, regardless of why the row exists.
"Balance Outstanding":    { path: offences.accountTotal, type: number, default: 875.50, baseline: true }
"Amount Paid or Cancelled": { path: offences.accountPaid, type: number, default: 375.00, baseline: true }
