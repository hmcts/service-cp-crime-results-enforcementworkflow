# Baseline entity defaults (Task 8, ruling 1). These nine have no CIMD-4372 result-code row of
# their own (unlike "Balance Outstanding"/"Amount Paid or Cancelled"/"Amount Imposed" above, which
# DO have rows but are ALSO schema-required — see the comment above them for what `baseline: true`
# actually means: schema-required, full stop, regardless of whether the label happens to be posted
# by some result code too). Finding I4 narrowed defaultFor(): for an OBJECT-typed root (one whose
# rows nest further under it, e.g. offences.accountTotal), it unions ONLY the baseline: true rows
# for that root, not every non-unmapped row — unioning every row made a requested-but-untouched
# entity richer than one a posted code only partially populated, which let posting an extra
# fields:[] code appear to REMOVE fields (see NowsDataItemsAssembler#defaultFor javadoc and
# NowsDataItemsAssemblerTest#posting_an_additional_fields_empty_code_never_shrinks_an_entity).
# NowsDataItemsAssembler.mergeBaselineGaps() merges that same baseline-only set into an entity a
# posted code left only PARTIALLY populated, filling just the fields that code's own contribution
# is missing — existing values always win, and non-required fields are deliberately never
# merge-filled this way, so a code's own contribution stays observable. A consequence of the
# baseline-only union: an entity with NO baseline row at all still comes back as `{}` for a
# requested-but-untouched entity, even if its schema has a `required` block — this is why "Payment
# Terms" (terms) and "Clamping Contractor name" (warrantContactDetails) above are also flagged
# baseline: true, one representative row each, so those two object-typed roots are never emitted
# empty either. Verified against v0.4.0 directly (not copied from anywhere): Defendant requires
# only defName; Offence requires dateImposed/offenceCode/offenceTitle/impositions/offenceTotal;
# Imposition requires amountImposed/amountPaid/impositionBalance (amountImposed is the one above,
# covered by "Amount Imposed"); CtBankDetails requires both ct_account_number and ct_sort_code.
# PaymentHistory and TransactionHistory declare no required properties at all (the
# `payment`/`transaction` arrays are not themselves required) AND have no field-paths.yaml rows of
# their own at all, so they are not "object-typed" by NowsDataItemsAssembler#isObjectTyped's
# structural test; they fall back to an empty branch, which already validates, so neither needs a
# baseline entry here.
"Defendant Name":
