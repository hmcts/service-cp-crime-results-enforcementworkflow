# Finding I3: these two rows deliberately target the SAME schema path
# (warrantContactDetails.warrantContactDetailsLine1). A result code posts at most one of the two
# in practice (see result-codes.yaml: "Clamping Contractor name" appears in two codes, "Process
# Server Name" in one, and never together), so the posted code's own value always wins via
# NowsDataItemsAssembler.put() and this collision does not currently reach a response that way.
#
# The reason this still matters: any consumer that walks catalogue.fieldPaths() in bulk — a
# future defaultFor()-style union, a diagnostic dump, a codegen step — would encounter both rows
# writing the same path and needs a deterministic, not accidental, answer for which one "wins".
# CatalogueLoader now preserves this file's row order deterministically (Collections
# .unmodifiableMap over the parsed LinkedHashMap, not Map.copyOf(), which randomises iteration
# order per JVM — see CatalogueLoader.load()) rather than papering over the ambiguity, and
# "Clamping Contractor name" is deliberately placed LAST of the two rows below, so a last-write-
# wins consumer resolves to it: it is the more common of the two in result-codes.yaml (posted by
# two codes vs. one), so the more representative choice absent any other signal. This is an
# explicit editorial choice, not an accident of file order — do not reorder without updating the
# pinning test in CatalogueLoaderTest
# (preserves_catalogue_file_order_deterministically_for_a_path_written_by_two_labels).
#
# Only "Clamping Contractor name" — the deliberate winner above — carries `baseline: true`. It was
# flagged so that warrantContactDetails, an object-typed root with no OTHER baseline row, is never
# emitted as `{}` for a requested-but-untouched entity (defaultFor() unions only baseline: true
# rows for an object-typed root — see the comment below and NowsDataItemsAssembler). "Process
# Server Name" stays non-baseline deliberately: flagging both would recreate exactly the same
# same-path collision inside defaultFor()'s own union, which the ordering above exists to avoid
# rather than reproduce.
"Process Server Name":
  { path: warrantContactDetails.warrantContactDetailsLine1, type: string, default: "Process Server Ltd" }
"Contractor's Name":
  { path: warrantContactDetails.warrantContactDetailsLine2, type: string, default: "Enforcement Contractor Ltd" }
"Contractor's Address":
  { path: warrantContactDetails.warrantContactDetailsLine3, type: string, default: "1 Contractor Way, Testville" }
"Clamping Contractor name":
  {
    path: warrantContactDetails.warrantContactDetailsLine1, type: string,
    default: "Clamping Contractor Ltd", baseline: true
  }
"Parent Name and Address":
  { path: defendant.parentGuardian.parentGuardianName, type: string, default: "Parent Guardian" }
"<Notes 1..3>":
