# CIMD-4372 field label used by some result codes' own field lists — a label being posted by some
# codes and being schema-required are independent facts, and both of the three below happen to be
# true. NowsDataItemsAssembler.mergeBaselineGaps() reads this flag to fill a schema-required gap
# left by a posted code's PARTIAL contribution to an entity, regardless of why the row exists.
