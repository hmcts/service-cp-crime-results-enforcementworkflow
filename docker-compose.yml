services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/enforcementworkflowdb
      # Dependencies on the host when run from compose (bootRun uses the localhost defaults instead)
      SPRING_PROFILES_ACTIVE: docker
      ARTEMIS_BROKER_URL: tcp://host.docker.internal:61616
      REFERENCE_DATA_URL: http://host.docker.internal:8089
      ENFORCEMENT_GATEWAY_URL: http://host.docker.internal:8082
      # Local only: placeholder paymentDueDate when no payment result (research.md R13).
      # Never set this in a deployed environment; the application default is NONE.
      PAYMENT_DUE_DATE_FALLBACK: HEARING_DATE
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: enforcementworkflowdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enforcementworkflowdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Optional local stubs for reference data and the enforcement gateway (tasks.md T077):
  #   docker compose --profile stubs up -d wiremock
  wiremock:
    image: wiremock/wiremock:3.13.2
    profiles: ["stubs"]
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
